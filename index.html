<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#214368">
<title>Saysha - Site Map</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--ink:#1C2B3D;--ink2:#214368;--paper:#F5F6F8;--card:#FFFFFF;--line:#DDE2E9;--acc:#214368;--acc2:#214368;--gold:#C9962E;--muted:#5D6877;--ok:#2F6B3F;--bad:#A33A2A}   /* the Saysha logo: navy and gold */
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
.top{position:sticky;top:0;z-index:5;background:#fff;color:var(--ink);padding:8px 14px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold)}
.top img{height:40px;width:auto;display:block}
.top .sub{font-size:13px;color:var(--muted);font-weight:600}
.top .sp{flex:1}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.btn{min-height:44px;padding:10px 14px;border-radius:10px;border:0;background:var(--acc);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--acc2);border:1px solid var(--acc)}
.btn.dk{background:var(--ink2)}
.btn.sm{min-height:44px;padding:8px 12px;font-size:14px}
.btn[disabled]{opacity:.5}
.top .btn{background:transparent;border:1px solid var(--acc);color:var(--acc)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;min-height:44px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px;color:var(--ink);font-family:inherit}
textarea{min-height:90px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 140px}
.meta{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:#E8EEF5;color:var(--acc2);margin:2px 4px 2px 0}
.site h3{margin:0 0 2px;font-size:17px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.acts a,.acts button{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#eee}
.fab{position:fixed;right:16px;bottom:18px;z-index:6;border-radius:28px;padding:14px 20px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.note{background:#FFF6E8;border:1px solid #EBCFA6;border-radius:10px;padding:10px;font-size:14px;margin:10px 0}
.err{background:#FBEAE7;border-color:#E3B1A8;color:var(--bad)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:9;max-width:90vw}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:14px}.kv div:nth-child(odd){color:var(--muted)}
.note.warn{background:#FFF4DE;border-color:#E9C27A}
.pill.ok{background:#DDF1E3;color:#1F5A30}
input[type=date]{min-height:44px}
.pill.warn{background:#FCEBC8;color:#7A5410}
.sugg{border:1px solid var(--line);border-radius:10px;margin-top:4px;max-height:220px;overflow:auto;background:#fff}
.sugg button{display:block;width:100%;text-align:left;min-height:44px;padding:8px 10px;border:0;border-bottom:1px solid var(--line);background:#fff;font-size:15px;color:var(--ink)}
.sugg button small{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  "use strict";
  var APP_VERSION = "2.1.0";
  /* the Saysha Site Map web app address (Deploy -> Web app -> URL ending /exec) */
  var API = "https://script.google.com/macros/s/AKfycbylcqcOso5Vb0yXdqOSMGD3BVkpJARoup87NdtPO5V3HWnEjFEnxH587i8f3-1vQfNR/exec";
  var K = "sk_";
  var S = { user: null, sites: [], visits: [], showroom: [], tab: "sites", srq: "", partners: [], stages: [], view: "list", q: "", filter: "all", here: null, edit: null, vis: null, busy: false, err: "", open: null, sugg: null };

  function ls(k, v) { try { if (v === undefined) { var x = localStorage.getItem(K + k); return x ? JSON.parse(x) : null; } if (v === null) localStorage.removeItem(K + k); else localStorage.setItem(K + k, JSON.stringify(v)); } catch (e) { return null; } }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function toast(t) { Array.prototype.forEach.call(document.querySelectorAll(".toast"), function (x) { x.remove(); }); var d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 3200); }
  function dmy(iso) { var d = new Date(iso); if (isNaN(d)) return ""; return String(d.getDate()).padStart(2, "0") + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + d.getFullYear(); }
  function photosOf(s) { try { var a = JSON.parse(s.photos || "[]"); return Array.isArray(a) ? a : []; } catch (e) { return []; } }

  function call(action, extra) {
    if (!API) return Promise.reject(new Error("The app is not linked to its server yet"));
    var b = Object.assign({ action: action, user: S.user && S.user.name, pin: S.user && S.user.pin }, extra || {});
    return fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(b) })
      .then(function (r) { return r.json(); });
  }
  /* 2.0.0 - distance in metres between two points */
  function dist(a, b) {
    if (!a || !b || !a.lat || !a.lng || !b.lat || !b.lng) return null;
    var R = 6371000, r = Math.PI / 180, dLa = (b.lat - a.lat) * r, dLo = (b.lng - a.lng) * r;
    var x = Math.sin(dLa / 2) * Math.sin(dLa / 2) + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLo / 2) * Math.sin(dLo / 2);
    return Math.round(2 * R * Math.asin(Math.sqrt(x)));
  }
  function mtr(m) { return m == null ? "" : m < 1000 ? m + " m" : (m / 1000).toFixed(1) + " km"; }
  function mob10(x) { return String(x || "").replace(/\D/g, "").slice(-10); }
  function visitsOf(id) { return (S.visits || []).filter(function (v) { return v.siteId === id; }).sort(function (a, b) { return String(b.at).localeCompare(String(a.at)); }); }
  function missing(s) { var m = []; if (!String(s.architect || "").trim()) m.push("architect"); if (!String(s.builder || "").trim()) m.push("builder"); return m; }
  /* the same client already on the list (by mobile), other than this one */
  function dupOf(e) { var m = mob10(e.mobile); if (m.length !== 10) return null; return S.sites.filter(function (x) { return x.id !== e.id && mob10(x.mobile) === m; })[0] || null; }
  function nearOf(e, within) { if (!e.lat || !e.lng) return []; return S.sites.filter(function (x) { return x.id !== e.id; }).map(function (x) { return { s: x, d: dist(e, x) }; }).filter(function (o) { return o.d != null && o.d <= within; }).sort(function (a, b) { return a.d - b.d; }); }
  function locate() {
    return new Promise(function (ok, bad) {
      if (!navigator.geolocation) { bad(new Error("This phone cannot give a location.")); return; }
      navigator.geolocation.getCurrentPosition(function (p) { ok({ lat: Number(p.coords.latitude.toFixed(6)), lng: Number(p.coords.longitude.toFixed(6)), acc: Math.round(p.coords.accuracy || 0) }); },
        function () { bad(new Error("Location not found - turn on location and try again.")); }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 30000 });
    });
  }
  /* ---------- 2.1.0 - THE SHOWROOM ---------- */
  var WHO = ["Client alone", "Client + Architect", "Architect alone", "Client + Builder", "Builder alone", "Client + Architect + Builder", "Other"];
  var OUTCOMES = ["Just looking", "Design discussed", "Measurement booked", "Quotation to send", "Quotation given", "Order confirmed", "Not interested"];
  var INTEREST = ["Modular kitchen", "Wardrobe", "Vanity", "TV unit", "Full home interior", "Appliances", "Other"];
  var OPEN_OUT = { "Design discussed": 1, "Measurement booked": 1, "Quotation to send": 1, "Quotation given": 1, "Just looking": 1 };
  function today() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function plusDays(n) { var d = new Date(Date.now() + n * 86400000); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function ymd(v) { var t = String(v || ""); if (/^\d\d\d\d-\d\d-\d\d/.test(t) && t.length === 10) return t; var d = new Date(t); return isNaN(d) ? "" : d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function dmyD(v) { var t = ymd(v); return t ? t.slice(8, 10) + "-" + t.slice(5, 7) + "-" + t.slice(0, 4) : ""; }
  function srByMobile(m) { m = mob10(m); return m.length === 10 ? (S.showroom || []).filter(function (r) { return mob10(r.mobile) === m; }) : []; }
  function srForSite(s) { var m = mob10(s.mobile); return (S.showroom || []).filter(function (r) { return r.siteId === s.id || (m.length === 10 && mob10(r.mobile) === m); }); }
  function srByArch(a) { a = String(a || "").trim().toLowerCase(); return a ? (S.showroom || []).filter(function (r) { return String(r.architect || "").trim().toLowerCase() === a; }) : []; }
  function hasC(w) { return /client/i.test(w || ""); } function hasA(w) { return /architect/i.test(w || ""); } function hasB(w) { return /builder/i.test(w || ""); }
  function canMap() { return S.user && (S.user.role === "mapper" || S.user.role === "admin"); }
  /* 1.2.0 - everyone adds sites; a site is edited by whoever entered it, or the mapper / owner */
  function canEdit(s) { return canMap() || (S.user && s && String(s.createdBy || "").toLowerCase() === String(S.user.name).toLowerCase()); }

  /* ---------- the outbox: a save made with no signal waits here and goes when the line is back ---------- */
  function outbox() { return ls("outbox") || []; }
  function flush() {
    var q = outbox(); if (!q.length || S.flushing) return Promise.resolve();
    S.flushing = true;
    var job = q[0];
    if (job.sr) {   /* 2.1.0 - a showroom visit waiting to go up */
      return call("showroom", { sv: job.sr }).then(function (r) {
        if (!r.ok) throw new Error(r.error || "Showroom visit not saved");
        var qq = outbox(); qq.shift(); ls("outbox", qq);
        var i = S.showroom.findIndex(function (x) { return x.id === r.row.id; }); if (i >= 0) S.showroom[i] = r.row; else S.showroom.unshift(r.row); ls("showroom", S.showroom);
        S.flushing = false; render(); return flush();
      }).catch(function (e) {
        S.flushing = false; var m = String(e && e.message || e);
        if (/who came|give the|needs 10/i.test(m)) { var qq = outbox(); qq.shift(); ls("outbox", qq); S.err = "Showroom visit not saved: " + m; }
        render();
      });
    }
    if (job.visit) {   /* 2.0.0 - a visit waiting to go up */
      return call("visit", { visit: job.visit }).then(function (r) {
        if (!r.ok) throw new Error(r.error || "Visit not saved");
        var qq = outbox(); qq.shift(); ls("outbox", qq);
        if (r.site) upsert(r.site);
        S.flushing = false; render(); return flush();
      }).catch(function (e) {
        S.flushing = false; var m = String(e && e.message || e);
        if (/not on the list|which site/i.test(m)) { var qq = outbox(); qq.shift(); ls("outbox", qq); S.err = "Visit not saved: " + m; }
        render();
      });
    }
    var p = Promise.resolve(job.site);
    var pend = (job.newPhotos || []).slice();
    pend.forEach(function (b64) {
      p = p.then(function (site) {
        return call("photo", { b64: b64 }).then(function (r) {
          if (!r.ok) throw new Error(r.error || "Photo not saved");
          var a = photosOf(site); a.push(r.url); site.photos = JSON.stringify(a);
          job.newPhotos.shift(); job.site = site; var qq = outbox(); qq[0] = job; ls("outbox", qq);
          return site;
        });
      });
    });
    return p.then(function (site) { return call("save", { site: site }); }).then(function (r) {
      if (!r.ok && r.dup) {   /* 2.0.0 - someone else mapped this client first: keep his, drop ours */
        var q2 = outbox(); q2.shift(); ls("outbox", q2);
        S.sites = S.sites.filter(function (x) { return x.id !== job.site.id; }); ls("sites", S.sites);
        S.err = "Not added - " + r.error + " on " + dmy(r.dup.createdAt) + ". Open it from the list and use Mark visit.";
        S.flushing = false; if (S.open === job.site.id) S.view = "list"; render(); return flush();
      }
      if (!r.ok) throw new Error(r.error || "Not saved");
      var qq = outbox(); qq.shift(); ls("outbox", qq);
      upsert(r.site);
      S.flushing = false; render();
      return flush();
    }).catch(function (e) {
      S.flushing = false;
      var m = String(e && e.message || e);
      if (/only|give the|needs 10|too big/i.test(m)) { var qq = outbox(); qq.shift(); ls("outbox", qq); S.err = "Not saved: " + m; render(); return; }
      render();
    });
  }
  function upsert(site) {
    if (!site) return;
    var i = S.sites.findIndex(function (x) { return x.id === site.id; });
    if (i >= 0) S.sites[i] = site; else S.sites.unshift(site);
    ls("sites", S.sites);
  }

  function pull() {
    S.busy = true; render();
    return call("list").then(function (r) {
      S.busy = false;
      if (!r.ok && r.mustChange) { S.user.mustChange = true; ls("user", S.user); S.view = "pin"; render(); return; }   /* 1.1.0 */
      if (!r.ok) { if (/wrong name|pin/i.test(r.error || "")) { signOut(); } S.err = r.error || "Could not load"; render(); return; }
      S.sites = r.sites || []; S.visits = r.visits || []; S.showroom = r.showroom || []; ls("showroom", S.showroom); S.stages = r.stages || S.stages; S.partners = r.partners || [];
      ls("sites", S.sites); ls("visits", S.visits); ls("stages", S.stages); if (canMap()) ls("partners", S.partners); else ls("partners", null);
      S.err = ""; ls("pulledAt", Date.now()); render();
    }).catch(function () { S.busy = false; S.err = "No signal - showing what this phone already has."; render(); });
  }
  function signOut() { ["user", "sites", "visits", "showroom", "partners", "pulledAt"].forEach(function (k) { ls(k, null); }); S.user = null; S.sites = []; S.partners = []; S.view = "list"; render(); }

  /* ---------- screens ---------- */
  function top() {
    return '<div class="top"><img src="logo.png" alt="Saysha"><div><div class="sub">Site Map' + (S.user ? ' · ' + esc(S.user.name) : '') + '</div></div><div class="sp"></div>' +
      (S.user ? '<button class="btn sm" data-a="refresh">' + (S.busy ? 'Loading…' : 'Refresh') + '</button>' : '') + '</div>';
  }
  function signIn() {
    return top() + '<div class="wrap"><div class="card"><h2 style="margin:0 0 6px">Sign in</h2>' +
      '<label for="nm">Your name</label><input id="nm" autocomplete="username" value="' + esc(S.nm || ls("lastName") || "") + '">' +
      '<label for="pn">PIN</label><input id="pn" type="password" inputmode="numeric" autocomplete="current-password">' +
      '<div class="meta" style="margin-top:6px">First time? Your PIN is the last 4 digits of your mobile number. Forgot your PIN? Ask the owner to reset it.</div>' +
      (S.err ? '<div class="note err">' + esc(S.err) + '</div>' : '') +
      '<div style="margin-top:12px"><button class="btn" data-a="signin" style="width:100%">' + (S.busy ? 'Checking…' : 'Sign in') + '</button></div></div>' +
      '<p class="meta" style="text-align:center">Version ' + APP_VERSION + '</p></div>';
  }
  function list() {
    var q = S.q.trim().toLowerCase(), me = String(S.user.name).toLowerCase();
    var rows = S.sites.filter(function (s) { if (!q) return true; return [s.client, s.mobile, s.address, s.area, s.architect, s.builder, s.stage].join(" ").toLowerCase().indexOf(q) >= 0; });
    if (S.filter === "missing") rows = rows.filter(function (s) { return missing(s).length; });
    if (S.filter === "mine") rows = rows.filter(function (s) { return String(s.createdBy || "").toLowerCase() === me || visitsOf(s.id).some(function (v) { return String(v.by).toLowerCase() === me; }); });
    if (S.filter === "near" && S.here) rows = rows.map(function (s) { return { s: s, d: dist(S.here, s) }; }).filter(function (o) { return o.d != null; }).sort(function (a, b) { return a.d - b.d; }).map(function (o) { o.s._d = o.d; return o.s; });
    var nMiss = S.sites.filter(function (s) { return missing(s).length; }).length;
    var chip = function (k, lab) { return '<button class="btn sm ' + (S.filter === k ? '' : 'ghost') + '" data-a="filter" data-k="' + k + '">' + lab + '</button>'; };
    var ob = outbox().length;
    var h = top() + '<div class="wrap">' + tabs() +
      (S.err ? '<div class="note err">' + esc(S.err) + '</div>' : '') +
      (ob ? '<div class="note">' + ob + ' site' + (ob > 1 ? 's' : '') + ' waiting to go up - they go as soon as there is signal. <button class="btn sm" data-a="flush">Send now</button></div>' : '') +
      installBar() +
      '<input id="q" placeholder="Search name, mobile, area, architect…" value="' + esc(S.q) + '">' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">' + chip("all", "All") + chip("near", "Near me") + chip("missing", "Arch / builder missing (" + nMiss + ")") + chip("mine", "Mine") + '</div>' +
      (S.filter === "near" && !S.here ? '<div class="meta" style="margin-top:6px">' + (S.locErr ? esc(S.locErr) : 'Finding where you are…') + '</div>' : '') +
      '<div class="meta" style="margin:8px 2px">' + rows.length + ' of ' + S.sites.length + ' sites</div>';
    if (!rows.length) h += '<div class="empty">' + (S.sites.length ? 'Nothing matches.' : ('No sites yet. Tap "+ New site" to add the first one.')) + '</div>';
    h += rows.slice(0, 300).map(function (s) {
      var ph = photosOf(s);
      return '<div class="card site" data-a="open" data-id="' + esc(s.id) + '">' +
        (ph[0] ? '<img src="' + esc(ph[0]) + '" alt="" style="float:right;width:64px;height:64px;object-fit:cover;border-radius:8px;margin-left:8px" loading="lazy">' : '') +
        '<h3>' + esc(s.client || "(no name)") + '</h3>' +
        '<div class="meta">' + esc([s.address, s.area].filter(Boolean).join(", ")) + '</div>' +
        '<div>' + (s.stage ? '<span class="pill">' + esc(s.stage) + '</span>' : '') + (s.architect ? '<span class="pill">Arch: ' + esc(s.architect) + '</span>' : '') + (s.builder ? '<span class="pill">Builder: ' + esc(s.builder) + '</span>' : '') +
        (missing(s).length ? '<span class="pill warn">Ask: ' + missing(s).join(" & ") + '</span>' : '') + '</div>' +
        (function () { var vs = visitsOf(s.id); return '<div class="meta">' + esc(dmy(s.createdAt)) + (s.createdBy ? ' · ' + esc(s.createdBy) : '') + ' · ' + (vs.length ? vs.length + ' visit' + (vs.length > 1 ? 's' : '') + ', last ' + esc(dmy(vs[0].at)) : 'no visits yet') + (s._d != null && S.filter === "near" ? ' · <b>' + mtr(s._d) + ' away</b>' : '') + '</div>'; })() +
        '<div style="clear:both"></div></div>';
    }).join("");
    h += '<div style="text-align:center;margin-top:20px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">' +
      (S.user.role === "admin" ? '<button class="btn ghost sm" data-a="people">People</button>' : '') +
      '<button class="btn ghost sm" data-a="chpin">Change PIN</button><button class="btn ghost sm" data-a="signout">Sign out</button></div><div style="text-align:center"><div class="meta" style="margin-top:6px">Version ' + APP_VERSION + '</div></div></div>';
    h += '<button class="btn fab" data-a="new">+ New site</button>';
    return h;
  }
  function mapLink(s) { return s.lat && s.lng ? "https://www.google.com/maps/search/?api=1&query=" + s.lat + "," + s.lng : (s.address ? "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent([s.address, s.area, s.city].filter(Boolean).join(", ")) : ""); }
  function detail() {
    var s = S.sites.filter(function (x) { return x.id === S.open; })[0];
    if (!s) { S.view = "list"; return list(); }
    var ml = mapLink(s), ph = photosOf(s), mob = String(s.mobile || "");
    return top() + '<div class="wrap"><button class="btn ghost sm" data-a="back">‹ All sites</button>' +
      '<div class="card"><h2 style="margin:0 0 4px">' + esc(s.client || "(no name)") + '</h2>' +
      '<div class="kv">' +
      '<div>Mobile</div><div>' + esc(mob) + '</div>' +
      '<div>Address</div><div>' + esc(s.address) + '</div>' +
      '<div>Area</div><div>' + esc([s.area, s.city].filter(Boolean).join(", ")) + '</div>' +
      '<div>Stage</div><div>' + esc(s.stage) + '</div>' +
      '<div>Architect</div><div>' + esc(s.architect) + '</div>' +
      '<div>Builder</div><div>' + esc(s.builder) + '</div>' +
      '<div>Measurements</div><div style="white-space:pre-wrap">' + esc(s.measure) + '</div>' +
      '<div>Notes</div><div style="white-space:pre-wrap">' + esc(s.notes) + '</div>' +
      '<div>Added</div><div>' + esc(dmy(s.createdAt)) + ' by ' + esc(s.createdBy) + '</div>' +
      '</div>' +
